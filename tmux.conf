# ─── PREFIX (LEADER KEY) ──────────────────────────────────────────
# Leader: C-\ (Ctrl + backslash)
#   On Italian ISO keyboards, the backslash key (`\|`) is between
#   Left Shift and Z. To use the leader, press Ctrl + that key.
#   (e.g. C-\ then h moves left, C-\ then C-\ cycles windows)
# To change the leader, edit the `prefix` and `send-prefix` lines.
#   Examples:
#     set -g prefix C-a         (Ctrl+a)
#     set -g prefix C-Space     (Ctrl+Space)
#     set -g prefix F1          (Function key F1)
unbind C-b
set -g prefix C-\\
bind C-\\ send-prefix

# Enable enhanced keyboard protocol (CSI u) so Shift+Enter,
# Ctrl+Enter, etc. are properly passed through to apps like opencode
set -g extended-keys on

# ─── PANE NAVIGATION (Vim-style) ─────────────────────────────────
# Leader + h/j/k/l  →  move to pane in that direction
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── RESIZE PANES (Vim-style) ──────────────────────────────────────
# Leader + H/J/K/L  →  resize pane in that direction by 5 cells (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── WINDOW CYCLE ────────────────────────────────────────────────
# Leader + Leader  →  jump to next window (cycles forward)
bind -rT prefix C-\\ next-window

# ─── SPLIT PANES ─────────────────────────────────────────────────
# Leader + "  →  split horizontally
# Leader + %  →  split vertically
#   (these are default tmux bindings, kept as-is)

# ─── RELOAD CONFIG ───────────────────────────────────────────────
# Leader + r  →  reload this config file
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
